description: >-
  Bechtel is one of the largest privately held engineering, procurement, and
  construction (EPC) companies in the world. Bechtel does not publish a
  public developer portal; technology integration is delivered through
  project-specific data exchanges with owners, joint-venture partners, and
  subcontractors, the Bechtel supplier portal, and industry-standard
  construction data exchange formats (IFC, COBie, CDE) over secure
  project-management platforms.
