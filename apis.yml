  - type: Features
    data:
      - name: EPC Project Delivery
        description: Bechtel delivers large-scale energy, mining, infrastructure, and defense projects under engineering-procurement-construction contracts.
      - name: Supplier Portal
        description: Registered suppliers and subcontractors transact with Bechtel through a managed supplier portal covering qualification, RFPs, purchase orders, and invoicing.
      - name: Project Common Data Environments
        description: Each major project operates a Common Data Environment (CDE) where owners, engineers, contractors, and subs exchange drawings, models, RFIs, submittals, and change orders.
      - name: BIM and IFC Models
        description: Building Information Modeling deliverables are exchanged in IFC, COBie, and proprietary platform formats with project stakeholders.
      - name: Defense and Government Work
        description: Bechtel performs work for the US Department of Energy, Department of Defense, and the UK Ministry of Defence under controlled programs.
  - type: UseCases
    data:
      - name: Major Capital Project Delivery
        description: Owners engage Bechtel to plan, engineer, procure, construct, and commission large capital assets.
      - name: Supplier and Subcontractor Onboarding
        description: Suppliers and subcontractors register with Bechtel and exchange commercial documents through the supplier portal.
      - name: Owner Engineering and PMC
        description: Bechtel acts as owner's engineer or program management contractor on multi-party programs such as megaprojects and infrastructure rollouts.
      - name: Decommissioning and Environmental Remediation
        description: Bechtel decommissions nuclear, defense, and industrial facilities and remediates impacted sites under regulated programs.
  - type: Compliance
    data:
      - name: NIST SP 800-171 / CMMC
        description: US Department of Defense programs require protection of Controlled Unclassified Information under NIST SP 800-171 and CMMC.
      - name: DOE 10 CFR Part 851 / 10 CFR Part 830
        description: US Department of Energy work follows worker safety and nuclear quality assurance regulations.
      - name: ISO 9001 / ISO 14001 / ISO 45001
        description: Quality, environmental, and occupational health & safety management systems align with applicable ISO standards.
      - name: FCPA / UK Bribery Act
        description: Anti-bribery controls follow the US Foreign Corrupt Practices Act and UK Bribery Act.
      - name: GDPR
        description: Personal data of European employees, suppliers, and customers is handled under the EU General Data Protection Regulation.
